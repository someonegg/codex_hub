name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node --input-type=module -e 'import p from "./package.json" with { type:"json" }; if (process.env.RELEASE_REF !== `refs/tags/v${p.version}`) throw new Error("Run this workflow on the matching version tag");'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:package
      - name: Check whether this version is already published
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          import pkg from "./package.json" with { type: "json" };
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`);
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Registry returned ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.status === 200}\n`);
          JS
      - run: npm publish
        if: steps.registry.outputs.published != 'true'
